*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in oklab,var(--accent) 10%,var(--sheet))}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn{padding:6px 10px;font-size:13px}

/* Mở đầu */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:12px}
.intro h1{font-size:clamp(40px,7vw,76px);letter-spacing:-.01em}
.intro h1 em{font-style:italic;color:var(--seal);font-weight:500}
.intro p.lede{font-size:18px;max-width:34em;margin:14px 0 0}
.counter{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.counter div{display:flex;flex-direction:column}
.counter b{font-family:var(--f-data);font-size:28px;font-weight:500}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:8px}
.past{display:flex;flex-direction:column;gap:6px;font-size:13px}
.past .row{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:6px}

/* Giấy khai sinh */
.cert{background:var(--sheet);border:1px solid var(--line);border-radius:4px;max-width:620px;margin:20px auto;padding:30px 30px 26px;position:relative;
  box-shadow:0 0 0 6px var(--sheet),0 0 0 7px var(--line)}
.cert h2{font-size:30px;text-align:center}
.cert .sub{text-align:center;margin-top:4px}
.cert dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:24px 0 20px}
.cert dt{color:var(--muted);font-size:13px}
.cert dd{margin:0;font-weight:500;border-bottom:1px dotted var(--line);padding-bottom:2px}
.stamp{position:absolute;right:22px;top:20px;width:86px;height:86px;border:2px solid var(--seal);border-radius:50%;color:var(--seal);
  display:grid;place-items:center;text-align:center;font-family:var(--f-data);font-size:10px;line-height:1.3;transform:rotate(-12deg);opacity:.85}
.cert .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* Bàn chơi */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.age{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.age small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-size:16px}
.spacer{flex:1}
.board{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:18px;align-items:start}
.stat{display:grid;grid-template-columns:76px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.bar{height:8px;background:color-mix(in oklab,var(--line) 70%,transparent);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.money{display:flex;flex-direction:column;gap:4px;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.money .big{font-family:var(--f-data);font-size:18px}
.decision{border:1px solid var(--seal);background:color-mix(in oklab,var(--seal) 9%,var(--sheet));border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.decision h3{font-size:22px}
.decision .choices{display:flex;gap:10px;flex-wrap:wrap}
.decision .choices .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 14px;flex:1 1 180px}
.decision .choices .btn small{color:var(--muted);font-size:12px;font-weight:400}
.log{display:flex;flex-direction:column;max-height:560px;overflow-y:auto;min-width:0}
.log .e{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.log .e:first-child{border-top:0}
.log .e .a{font-family:var(--f-data);color:var(--muted);font-size:12px;padding-top:2px}
.log .e.good .t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:2px}
.log .e.bad .t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-right:7px;vertical-align:2px}
.log .e.big .t{font-weight:600}
.peer{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.peer:first-of-type{border-top:0}
.peer .n{font-weight:600;font-size:14px}
.peer.dead .n{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.map i{aspect-ratio:1;border-radius:2px;background:color-mix(in oklab,var(--line) 55%,transparent);max-width:100%}
.map i.now{outline:2px solid var(--accent);outline-offset:1px}
.map i.end{background:var(--ink)}
.map i.le{box-shadow:inset 0 0 0 1px var(--seal)}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.mx{overflow-x:auto}.mx table{border-collapse:collapse;font-size:13px;font-family:var(--f-data)}
.mx th,.mx td{border:1px solid var(--line);padding:6px 10px;text-align:center}.mx th{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.codex{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:14px;background:color-mix(in oklab,var(--accent) 5%,var(--sheet))}

.mx td.fog{color:var(--muted);font-style:italic}

body.tunnel .board>aside:last-child,body.tunnel .stat:not(.money-stat),body.tunnel #foci,body.tunnel .map,body.tunnel #peers{opacity:.25;filter:blur(1px);transition:opacity .6s,filter .6s}

body.tunnel .decision{box-shadow:inset 0 0 0 2px var(--bad)}

.castlist{display:flex;flex-direction:column;gap:6px;font-size:13px}.castlist .p{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:baseline}.castlist .p i{width:10px;height:10px;border-radius:50%;display:inline-block;align-self:center}
.castlist .p .r{color:var(--muted);font-size:12px}.castlist .p.dead{opacity:.45;text-decoration:line-through}
.vig{font-style:italic;color:var(--muted)}
.log .e.choice .t{font-weight:600;color:var(--accent)}.log .e.door .t{color:var(--bad);font-style:italic}.log .e.promise .t{color:var(--seal)}
.cause{font-size:13px;border-left:3px solid var(--seal);padding:6px 10px;background:color-mix(in oklab,var(--seal) 10%,var(--sheet));border-radius:4px}
.doorbadge{display:inline-block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--bad);border:1px solid var(--bad);border-radius:3px;padding:0 5px;margin-top:4px}
.epi{font-size:12px;color:var(--seal);font-style:italic}
.delta{position:absolute;right:0;top:-10px;font-family:var(--f-data);font-size:11px;font-weight:600;animation:rise 1.4s ease-out forwards;pointer-events:none}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}@keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.stat{position:relative}
.decision.micro{border-color:var(--line);background:var(--sheet);padding:14px}.decision.micro h3{font-size:18px}

.end{max-width:760px;margin:10px auto;display:flex;flex-direction:column;gap:20px}
.end h2{font-size:clamp(30px,5vw,46px)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.facts div{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:2px}
.facts b{font-family:var(--f-data);font-size:20px;font-weight:500}
.foot{font-size:12px;color:var(--muted);max-width:70em}

function makeRng(seed){let s=seed>>>0;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  c=[-.007784894002430293,-.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
  d=[.007784695709041462,.3224671290700398,2.445134137142996,3.754408661907416];

  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  q=p-.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];

/* Thu nhập theo phân vị, phân phối log-chuẩn suy ra từ Gini */
function incomeAt(c,p){const sig=Math.SQRT2*probit((c.gi+1)/2);const mean=c.g*0.6;return mean*Math.exp(sig*probit(clamp(p,.005,.995))-sig*sig/2)}

/* ================= TỬ VONG: bảng sống hiệu chỉnh theo tuổi thọ ================= */

const _haz={};
function lnAFor(c,sex){const k=c.id+sex;if(_haz[k]!=null)return _haz[k];const target=c.le+(sex==="F"?2.4:-2.4);let lo=-20,hi=-3;
  for(let i=0;i<50;i++){const m=(lo+hi)/2;if(e0(c,m)>target)lo=m;else hi=m}return _haz[k]=(lo+hi)/2}
function lifeExp(c,sex){return Math.round(c.le+(sex==="F"?2.4:-2.4))}

function log(L,text,tone=""){L.seen=L.seen||{};const n=(L.seen[text]||0);L.seen[text]=n+1;if(n>0&&tone!=="choice"&&!/^(Năm nay|Bạn hứa)/.test(text))text=(n===1?"Lại một lần nữa, ":"Như mọi lần, ")+text.charAt(0).toLowerCase()+text.slice(1);L.log.push({age:L.age,text,tone})}

const FOCI={
  play:{label:"Vui chơi"},

function availableFoci(L){if(L.age<6)return["play"];return["study","work","family","health","rest"]}
function defaultFocus(L){if(L.age<6)return"play";if(L.school.in)return"study";const r=L.ra();if(L.st.health<40)return"health";if(L.married&&r<.35)return"family";return r<.6?"work":r<.8?"family":"health"}

function deathQ(L){const x=L.age;let q=qBase(L.c,x,lnAFor(L.c,L.sex));
  if(x<5)q*=Math.exp((0.5-L.fam)*0.9);
  else q=1-Math.exp(Math.log(1-Math.min(q,.999))*Math.exp((refHealth(x)-L.st.health)/30));
  if(L.ill&&!L.ill.treated)q=Math.min(1,q+L.ill.risk);
  return Math.min(q,1)}

function stepYear(L){
  if(!L.alive||L.pending)return;
  // 1. năm này có qua khỏi không?
  if(L.r()<deathQ(L)){die(L);return}
  L.age++;

  if(L.ar&&L.ar.state.dead&&L.ar.state.capitals.bioEnergy.value<=0&&L.alive){die(L,"kiệt sức");return}

}

function applyFocus(L){switch(L.focus){

  case"family":addSt(L,"rel",4);break;
  case"health":addSt(L,"health",3);break;
  case"rest":addSt(L,"happy",3);break;

function refHealth(x){return x<35?68:68-0.045*Math.pow(x-35,1.6)}

}

function schooling(L){const S=L.school,c=L.c,r=L.r,x=L.age;

        choices:[{label:"Thi đại học",hint:`Cơ hội đậu khoảng ${Math.round(uniChance(L)*100)}%`},{label:"Đi làm ngay",hint:"Có thu nhập từ năm nay"}],def:uniChance(L)>({curious:.2,bold:.55,kind:.35,tough:.45}[temperOf(L)]||.35)?0:1};

function temperOf(L){const fl=L.lw?L.lw.sflags:null;if(!fl)return null;for(const t of ["curious","bold","kind","tough"])if(fl.has("temper_"+t))return t;return null}

function careerOptions(L){const c=L.c,S=L.school,fl=L.lw?L.lw.sflags:new Set();const av=new Set();
  if(S.deg){["teach","health","office","tech","market"].forEach(x=>av.add(x))}

  if(fl.has("coder")&&av.has("tech"))pref="tech";if(fl.has("clinic_vol")&&av.has("health"))pref="health";if(fl.has("origin_poor_rural")&&!S.deg&&L.r()<.4)pref="farm";
  const rest=[...av].filter(x=>x!==pref&&x!==pref2);const out=pref?[pref]:[];if(pref2)out.push(pref2);while(out.length<3&&rest.length)out.push(rest.splice(Math.floor(L.r()*rest.length),1)[0]);

function assignJob(L,fam){const fl=L.lw.sflags;const old=famOf(L);for(const k in FAM)fl.delete("job_"+k);fl.add("job_"+fam);
  const t=FAM[fam].t;const title=fam==="health"?(L.school.deg&&L.r()<.35?"bác sĩ":"y tá"):fam==="office"&&!L.school.deg?"nhân viên văn phòng":t[Math.floor(L.r()*t.length)];

    choices:opts.map(f=>f.startsWith("path:")?(d=>({label:d.vn.charAt(0).toUpperCase()+d.vn.slice(1),hint:"Con đường bạn có năng khiếu · bấp bênh hơn",fx:L2=>becomePath(L2,d.id)}))(Argon.PATHS[f.slice(5)]):({label:FAM_VN[f].charAt(0).toUpperCase()+FAM_VN[f].slice(1),hint:`≈ ${fmtVND(incomeAt(c,p)*FAM[f].m)}/tháng`+(f==="build"||f==="factory"?" · nặng nhọc":f==="tech"||f==="office"?" · ngồi một chỗ":f==="farm"?" · phụ thuộc trời":f==="market"?" · lên xuống thất thường":""),fx:L2=>assignJob(L2,f)})),def:0})}

function work(L){if(!L.job||L.retired)return;

function lifePassive(L){const r=L.r,x=L.age,c=L.c;

    log(L,`Con bạn ra đời: bé ${k.name}.`,"good big");addSt(L,"happy",6);addSt(L,"rel",4);

  else{name="Người thực dụng";desc="Bạn tính từng trường hợp, không theo nguyên tắc nào cố định."}

<script id="living">
/* ================= LIVING WEB (host) =================

   Mọi thay đổi thế giới đi qua applyEffect(); kịch bản chỉ là dữ liệu. */
const POOL = { major: null, micro: null, generic: null };
function pools() { if (!POOL.major) { const G = Argon.MICRO_GATES; const gated = Argon.MICRO.map(s => G[s.id] ? { ...s, prerequisites: c => s.prerequisites(c) && G[s.id](c) } : s); POOL.major = Argon.STORYLETS.concat(gated.filter(s => s.category !== "micro"), Argon.BRANCHES.filter(s => s.category !== "micro"), Argon.LIFE_VARIANTS || []); POOL.micro = gated.filter(s => s.category === "micro").concat(Argon.BRANCHES.filter(s => s.category === "micro"), Argon.BRANCHES2 || [], Argon.TEMPER_LIFE || [], Argon.TEMPER2_ECHO || [], (Argon.PATH_STORYLETS || []).filter(s => s.category === "micro")); POOL.major = POOL.major.concat((Argon.PATH_STORYLETS || []).filter(s => s.category !== "micro")); POOL.generic = gated.filter(s => s.category === "micro"); } return POOL; }
function yearBudget(L) { const a = L.age; if (a < 6) return 0; if (a < 13) return 1; if (a < 18) return 2; if (a < 65) return 2 + (L.ar && L.ar.rng.next() < 0.35 ? 1 : 0); return 1; }
const LW = {
  ROLE_VN: { mother: "mẹ", father: "cha", sibling: "anh/chị/em", childhood_friend: "bạn thân từ nhỏ", bully: "kẻ bắt nạt ngày xưa", neighbor: "hàng xóm", first_boss: "sếp đầu tiên", official: "cán bộ", partner: "đối tác", creditor: "chủ nợ", mentor: "người thầy", rival: "đối thủ", spouse: "bạn đời", child: "con" },
  TAG_VN: { HELPED_IN_CRISIS: "đã giúp lúc khó", WIN_WIN_DEAL: "làm ăn sòng phẳng", KEPT_PROMISE: "giữ lời", STOOD_UP_FOR_ME: "đứng về phía họ", BETRAYED_PARTNERSHIP: "phản bội khi hùn vốn", REFUSED_HELP: "từ chối giúp", CHEATED_ME: "lừa họ", HUMILIATED_ME: "làm họ bẽ mặt", TOOK_MY_LAND: "lấy đất", BULLIED_ME: "bắt nạt", GOSSIP_HEARD_BAD: "nghe tiếng xấu", GOSSIP_HEARD_GOOD: "nghe tiếng tốt" },
  SECRET_VN: { CHEATED_EXAM: "chép bài thi", PAID_BRIBE: "đưa hối lộ", DEFRAUDED_FRIEND: "lừa bạn", STOLE_SHARED_PROFIT: "giấu tiền chung", FORGED_PAPERS: "làm giấy tờ giả", ABANDONED_PARENT: "bỏ mặc cha mẹ" }
};

/* ---- khởi tạo ở lúc sinh ---- */
function livingInit(L) {
  if (L.lw) return;
  argonInit(L, true);
  const s = L.ar.state, rng = L.ar.rng;
  const nm = NAMES[L.c.nm];
  const cast = Argon.createCast(s, rng, { male: nm.M, female: nm.F }, L.fam);
  // tên không trùng nhau và không trùng tên người chơi
  const given = L.name.split(" ").pop(); const used = new Set([given]);
  for (const m of cast.values()) { if (used.has(m.name)) { const pool = (ROLE_SEX_OF(m.role, rng) === "F" ? nm.F : nm.M).filter(x => !used.has(x)); if (pool.length) { m.name = pool[Math.floor(rng.next() * pool.length)]; s.npcs.get(m.id).name = m.name; } } used.add(m.name); }
  { const tf = L.c.tf; const absent = { sibling: tf < 1.6 ? 0.5 : tf < 2.6 ? 0.25 : 0.1, mentor: 0.5, bully: 0.4, rival: 0.4, partner: 0.3, childhood_friend: 0.15 };
    for (const m of cast.values()) { const p = absent[m.role]; if (p && rng.next() < p) { m.alive = false; m.absent = true; m.dependent = false; if (m.role === "sibling") L.flagsInit = (L.flagsInit || []).concat("only_child"); } } }
  for (const m of cast.values()) L.ar.npcStart.set(m.id, s.npcs.get(m.id).liquid);
  L.lw = { cast, mem: Argon.createMemory(), st: Argon.createStoryteller(rng), history: [], recentVig: [], sflags: new Set(), counters: {}, queue: [], lastVig: -9, depLogged: -9, cz: Argon.createCausality(), promises: [] };
  if (!L.replay) metaApply(L);

  { const urbanShare = clamp(0.1 + 0.28 * Math.log10(Math.max(900, L.c.g) / 800), 0.15, 0.85); const urban = rng.next() < urbanShare; const o = L.fam > 0.75 ? "rich" : L.fam < 0.4 ? (urban ? "poor_urban" : "poor_rural") : "middle"; L.lw.sflags.add("origin_" + o); L.lw.sflags.add(urban ? "urban" : "rural"); L.origin = o; }
}
function ROLE_SEX_OF(role, rng) { return role === "mother" ? "F" : (role === "father" || role === "bully" || role === "official") ? "M" : (rng.next() < 0.5 ? "M" : "F"); }
function castName(L, id) { const m = L.lw && L.lw.cast.get(id); if (m) return m.name; const n = L.ar && L.ar.state.npcs.get(id); return n ? n.name : "ai đó"; }

}

/* ---- FactContext ---- */
/** 0..1 cố định theo đời (từ seed): quyết định đời này gặp lát nội dung tùy chọn nào. */
function lifeLuck(L) { if (L.luck === undefined) L.luck = (Math.imul((L.seed >>> 0) ^ 0x5bd1e995, 2654435761) >>> 0) / 4294967296; return L.luck; }
function factContext(L) {

    age: L.age, sex: L.sex, country: L.c.id, luck: lifeLuck(L), gdp: L.c.g, poor_country: L.c.g < 8000, family_wealth: L.fam,
    in_school: L.school.in, years_school: L.school.years, has_degree: L.school.deg, has_job: !!L.job && !L.retired, job: L.job || "", farmer: L.job === "nông dân" || L.job === "phụ giúp việc đồng áng", worker: /công nhân|kho|nhà máy|thợ/.test(L.job || ""), retired: L.retired,
    married: L.married, widowed: !!L.widowed, kids_alive: kids.length, kids_teen: kids.filter(a => a >= 13 && a <= 19).length, kids_school: kids.filter(a => a >= 6 && a < 18).length,
    parents_alive: parents.length, parent_old: parents.some(m => L.age + m.age_offset >= 65), parent_sick: parents.some(m => m.health < 40), sibling_alive: !!castMap.sibling,
    income: yearly, savings, debt, debt_ratio: debt / yearly, rich: savings >= 3 * yearly, broke: savings < 0.1 * yearly,
    health: L.st.health, happy: L.st.happy, know: L.st.know, rel: L.st.rel, bandwidth: g.bw, bandwidth_locked: g.bw < 30, scarcity: !!g.scarcity, rat_race: g.ratRace,
    tier: g.tier, agency: g.agency, reputation: rep, allies: Object.values(opinion).filter(v => v >= 0.5).length, enemies: Object.values(opinion).filter(v => v <= -0.35).length,
    econ_phase: s.economic_phase, ill: !!L.ill, migrated: L.migrated, flags: L.lw.sflags, counters: L.lw.counters, cast: castMap, opinion, roles, hooks: hooksMap, last_move, doors: L.lw.cz.doors,
    years_since_major: L.age - L.lw.st.last_major_age, tension: L.lw.st.tension, crises_survived: s.perception.crises_survived, traits: L.traits || { coop: 0, fair: 0, risk: 0, bold: 0 }
  };
}

/* ---- Hiệu ứng khai báo → thế giới ---- */
function applyEffect(L, e, npcId) {
  const s = L.ar.state, yearly = Math.max(300, householdIncome(L)), ctxNpc = id => (id && s.npcs.get(id)) || (npcId && s.npcs.get(npcId));
  if (e.gamble) { const win = L.r() < e.gamble.p; applyEffect(L, { ...e, gamble: undefined, log: undefined }, npcId); applyEffect(L, win ? e.gamble.win : e.gamble.lose, npcId); return; }
  if (e.game) { const npc = ctxNpc(e.game.npc); if (npc) { const r = argonPlay(L, npc, e.game.move, yearly * e.game.stake_frac, npc.id); const o = r.outcome;

  const p2 = `${S.rounds ? `Bạn ngồi vào ${S.rounds} ván với người khác và để lại ${S.net_systemic_surplus >= 0 ? "thêm " : "ít hơn "}${fmtPPP(Math.abs(S.net_systemic_surplus))} cho tất cả những người ngồi cùng bàn, trên ${fmtPPP(S.potential_surplus)} có thể có nếu ai cũng thật.` : "Bạn ít khi ngồi vào bàn với ai."} ${prospered.length ? `${prospered.join(", ")} khá lên nhờ có bạn.` : ""} ${preyed.length ? `${preyed.join(", ")} khá lên trên lưng bạn.` : ""} ${bankrupt.length ? `${bankrupt.join(", ")} trắng tay, và một phần là vì bạn.` : ""} ${friends.length ? `${friends.join(", ")} tin bạn đến cuối.` : ""} ${enemies.length ? `${enemies.join(", ")} thì không bao giờ.` : ""}`;

/* ---- Chuyện nhỏ: 1–3 mỗi năm ---- */
function microScene(L, ctx) {
  const lw = L.lw; if (!lw || L.pending || !L.alive || (lw.decisions || 0) >= (lw.budget || 0)) return false;
  ctx = ctx || factContext(L);
  const cnt = {}, last = {}; for (const h of lw.history) { cnt[h.id] = (cnt[h.id] || 0) + 1; last[h.id] = h.age; }
  // Ngân sách lặp: mỗi thẻ tối đa maxPerLife lần (mặc định 1), lần lặp phải cách lần trước ≥ 10 năm.
  const pool = pools().micro.filter(s => (cnt[s.id] || 0) < (s.maxPerLife ?? 1) && (last[s.id] === undefined || L.age - last[s.id] >= 10));
  let st = Argon.selectStorylet(pool, ctx, { minUrgency: 0, history: lw.history, age: L.age }, L.ar.rng);
  // Lấp chỗ trống: chuyện chung không theo nhánh, chỉ khi nhánh hết chuyện
  if (!st && L.ar.rng.next() < 0.6) { const fill = Argon.eligible(pools().generic.filter(s => !cnt[s.id]), ctx, { minUrgency: 0, history: lw.history, age: L.age }); if (fill.length) st = fill[Math.floor(L.ar.rng.next() * fill.length)].s; }
  if (!st) return false;
  lw.decisions = (lw.decisions || 0) + 1;
  lw.history.push({ id: st.id, age: L.age });
  const sc = sceneFromStorylet(L, st, ctx); sc.micro = true;
  let marks = []; if (st.causes) { try { marks = Argon.resolveCauses(lw.cz, st.causes(ctx) || []); } catch { } }
  if (marks.length) { Argon.attachConsequence(marks, L.age, st.id, sc.title); sc.causes = marks; sc.text += " " + causeLine(L, marks); }
  scene(L, sc); return true;
}
/* Sau mỗi lựa chọn, nếu năm nay còn ngân sách thì đưa tiếp một chuyện nhỏ */
function livingFollowUp(L) { if (!L.lw || L.pending || !L.alive || L.age < 6) return; microScene(L, null); }
/* ---- Thói quen trôi theo năm ---- */
function habitYear(L) {
  const c = L.lw.counters, yi = Math.max(300, householdIncome(L));
  const sm = c.smoke || 0, dr = c.drink || 0, ex = c.exercise || 0, rd = c.read || 0, sv = c.save || 0, gb = c.gamble || 0;
  if (sm > 0) { c.smoke = sm + 0.3; addSt(L, "health", -0.15 * Math.min(sm, 12)); }
  if (dr >= 2) { c.drink = dr + 0.2; addSt(L, "health", -0.12 * (dr - 2)); addSt(L, "rel", -0.1 * (dr - 2)); }
  if (ex > 0) { addSt(L, "health", 0.15 * Math.min(ex, 6)); c.exercise = ex + (L.focus === "health" ? 1 : -0.2); }
  if (rd > 0) { addSt(L, "know", 0.1 * Math.min(rd, 6)); c.read = rd + (L.focus === "study" ? 0.5 : -0.1); }
  if (sv > 0) { L.savings += 0.01 * Math.min(sv, 8) * yi; if (L.ar && L.ar.frugal) c.save = sv + 0.5; }
  if (gb >= 2) { c.gamble = gb + 0.15; L.savings -= 0.01 * gb * yi; }
  if (L.focus === "health" && sm > 0 && L.r() < 0.15) { c.smoke = Math.max(0, sm - 2); }
}

</script>

<script id="choice">
let CF_FOCUS=null;

}

/* ---- Cuộc đời suýt có: chạy lại đúng hạt giống với lựa chọn khác ---- */
function lifeSummary(P) {
  const T = P.ar ? Argon.lifeTopology(P.ar.state, P.ar.npcStart) : null;

}

function diffVN(a, b, fromAge) {

/* ---- Tiền kiếp (meta-progression, lưu trên trình duyệt) ---- */
const META = { key: "mlcd.meta", get() { try { return JSON.parse(localStorage.getItem(this.key) || "null") || { lives: 0, perks: [], codex: {} }; } catch { return { lives: 0, perks: [], codex: {} }; } }, set(m) { try { localStorage.setItem(this.key, JSON.stringify(m)); } catch { } } };
const PERKS = [
  { id: "insight", vi: "Nhìn thấu một lần", desc: "Lần thẩm định đầu tiên của mỗi đời không tốn băng thông." },

];
function metaOnDeath(L) { const m = META.get(); m.lives++; const next = PERKS[Math.min(m.perks.length, PERKS.length - 1)]; if (next && !m.perks.includes(next.id) && m.perks.length < PERKS.length) m.perks.push(next.id); for (const k in (L.codex || {})) m.codex[k] = true; META.set(m); return m; }
function metaApply(L) { const m = META.get(); if (!m.lives) return; if (m.perks.includes("codex")) { L.codex = L.codex || {}; for (const k in m.codex) if (!L.codex[k]) L.codex[k] = 0; } if (m.perks.includes("mentor")) { const me = castRole(L, "mentor"); if (me) Argon.setEdge(L.ar.state.graph, me.id, "player", 0.5, 0); } L.perks = m.perks.slice(); }

</script>

<script id="narrator">
/* ================= NGƯỜI KỂ CHUYỆN (AI agent sinh tình huống) =================
   AI viết tình huống; engine là trọng tài. Mỗi lựa chọn chỉ được dùng bộ hiệu ứng cố định bên dưới,
   mọi con số bị cắt ngưỡng, và AI không bao giờ được biết chiến lược thật của NPC. */
const NAR = {
  enabled: true, mode: "quick", sample: null, status: "init", // init · ready · off · busy · error
  cooldownMin: 3, cooldownMax: 6, lastErr: null, calls: 0
};
async function narratorInit() {
  try {
    if (!window.claude || !window.claude.use) { NAR.status = "off"; return; }
    const s = await window.claude.use("sample");
    NAR.sample = s; NAR.status = s ? "ready" : "off";
  } catch (e) { NAR.status = "off"; }
  if (typeof render === "function") render();
}

/* ---- Bộ từ vựng hiệu ứng mà AI được phép dùng ---- */
const FX_LIMITS = { health: 15, happy: 15, know: 12, rel: 15, bw: 20, money: 1.2, income_mult: [0.7, 1.4], trust: 0.6 };
function clampFx(fx) {
  const o = {};
  if (!fx || typeof fx !== "object") return o;
  for (const k of ["health", "happy", "know", "rel", "bw"]) if (typeof fx[k] === "number") o[k] = clamp(fx[k], -FX_LIMITS[k], FX_LIMITS[k]);
  if (typeof fx.money === "number") o.money = clamp(fx.money, -FX_LIMITS.money, FX_LIMITS.money);
  if (typeof fx.income_mult === "number") o.income_mult = clamp(fx.income_mult, FX_LIMITS.income_mult[0], FX_LIMITS.income_mult[1]);
  if (fx.trust && typeof fx.trust === "object" && typeof fx.trust.delta === "number") o.trust = { npc: String(fx.trust.npc || ""), delta: clamp(fx.trust.delta, -FX_LIMITS.trust, FX_LIMITS.trust) };
  for (const k of ["coop", "fair", "risk", "bold"]) if (typeof fx[k] === "number") o[k] = clamp(Math.round(fx[k]), -3, 3);
  if (typeof fx.log === "string") o.log = fx.log.slice(0, 220);
  if (Array.isArray(fx.flags)) o.flags = fx.flags.filter(x => typeof x === "string").map(x => x.slice(0, 40)).slice(0, 4);
  if (fx.later && typeof fx.later === "object" && typeof fx.later.note === "string") o.later = { years: clamp(Math.round(+fx.later.years || 5), 1, 30), note: fx.later.note.slice(0, 200) };
  if (fx.gamble && typeof fx.gamble === "object") o.gamble = { p: clamp(+fx.gamble.p || 0.5, 0.05, 0.95), win: clampFx(fx.gamble.win), lose: clampFx(fx.gamble.lose) };
  if (fx.game && typeof fx.game === "object" && ["cooperate", "defect", "arbitrage"].includes(fx.game.move)) o.game = { npc: String(fx.game.npc || ""), move: fx.game.move, stake_frac: clamp(+fx.game.stake_frac || 0.3, 0.05, 1) };
  return o;
}
function applyFx(L, fx, npcMap) {
  const yearly = Math.max(300, householdIncome(L));
  const tone = (fx.money || 0) < 0 || (fx.health || 0) < 0 || (fx.happy || 0) < -5 ? "bad" : (fx.money || 0) > 0 || (fx.happy || 0) > 5 ? "good" : "";
  if (fx.game && L.ar) { const npc = npcMap[fx.game.npc]; if (npc) { const r = argonPlay(L, npc, fx.game.move, yearly * fx.game.stake_frac, npc.id);
      const o = r.outcome; log(L, `${fx.log || ""} → ${AR.CELL_VN[o.cell]}. ${npc.name} đã ${o.npcMove === "cooperate" ? "hợp tác" : "phản bội"}. Bạn ${o.payoffA.capital >= 0 ? "nhận" : "mất"} ${fmtPPP(Math.abs(o.payoffA.capital))}.`, o.cell === "win_win" || o.cell === "arbitrage" ? "good" : o.cell === "sucker" || o.cell === "mutual_destruction" ? "bad" : "");
      if (o.cell === "sucker" || o.cell === "exploitation") L.ar.betrayedThisYear = o.cell === "sucker"; } }
  else if (fx.log) log(L, fx.log, tone);
  if (fx.gamble) { const win = L.r() < fx.gamble.p; log(L, win ? "May mắn đứng về phía bạn." : "Lần này vận không thuận.", win ? "good" : "bad"); applyFx(L, win ? fx.gamble.win : fx.gamble.lose, npcMap); return; }
  for (const k of ["health", "happy", "know", "rel"]) if (fx[k]) addSt(L, k, fx[k]);
  if (fx.bw && L.ar) { L.ar.state.capitals = Argon.applyDelta(L.ar.state.capitals, { bandwidth: fx.bw }); L.st.bw = L.ar.state.capitals.cognitiveBandwidth.value; }
  if (fx.money) L.savings += yearly * fx.money;
  if (fx.income_mult && L.income > 0) L.income *= fx.income_mult;
  if (fx.trust && L.ar) { const npc = npcMap[fx.trust.npc]; if (npc) Argon.propagate(L.ar.state.graph, npc.id, fx.trust.delta, L.ar.state.tick); }
  for (const k of ["coop", "fair", "risk", "bold"]) if (fx[k]) trait(L, k, fx[k]);
  if (fx.flags) { L.threads = L.threads || []; for (const f of fx.flags) if (!L.threads.some(t => t.flag === f)) L.threads.push({ flag: f, age: L.age }); }
  if (fx.later) { L.threads = L.threads || []; L.threads.push({ flag: "hẹn", age: L.age, due: L.age + fx.later.years, note: fx.later.note }); }
}

/* ---- Gói trạng thái gửi cho AI (không bao giờ chứa chiến lược thật của NPC) ---- */
function statePacket(L) {
  const g = argonGate(L);
  const npcs = [];
  if (L.ar) for (const n of L.ar.state.npcs.values()) {
    const e = Argon.getEdge(L.ar.state.graph, n.id, "player");
    const seen = n.history.slice(-3).map(h => (h.npcMove === "cooperate" ? "hợp tác" : "phản bội")).join(",");
    npcs.push({ id: n.id, ten: n.name, vai: n.id.split("_")[0] === "doitac" ? "đối tác cũ" : n.id.split("_")[0] === "ban" ? "bạn thân" : n.id.split("_")[0], niem_tin: +((e ? e.trust : 0).toFixed(2)), da_thay: seen || "chưa từng chơi ván nào" });
  }
  const threads = (L.threads || []).map(t => t.due ? `hẹn ${t.due} tuổi: ${t.note}` : `${t.flag} (từ ${t.age} tuổi)`).slice(-8);
  const c = L.c;
  return {
    tuoi: L.age, gioi: L.sex === "M" ? "nam" : "nữ", ten: L.name, nuoc: c.n, noi_sinh: L.birthC.n, gdp_ppp: c.g, gia_dinh: famWord(L.fam),
    hoc: L.school.uni ? "đang học đại học" : L.school.in ? `lớp ${L.school.years}` : L.school.deg ? "có bằng đại học" : L.school.never ? "chưa từng đi học" : `học hết lớp ${L.school.years}`,
    nghe: L.retired ? "đã nghỉ hưu" : (L.job || "chưa đi làm"), thu_nhap_nam: Math.round(householdIncome(L)), tiet_kiem: Math.round(L.savings), no: Math.round(L.debt || 0),
    quy_doi: `1$ PPP ≈ ${VND_PER_PPP.toLocaleString("vi-VN")}đ`,
    hon_nhan: L.married ? `đã kết hôn với ${L.spouse}` : L.widowed ? "góa" : "độc thân", con: L.kids.filter(k => k.alive).map(k => `${k.name} ${L.age - k.born} tuổi`),
    chi_so: { suc_khoe: Math.round(L.st.health), hanh_phuc: Math.round(L.st.happy), kien_thuc: Math.round(L.st.know), quan_he: Math.round(L.st.rel), bang_thong: Math.round(g.bw) },
    tang: AR.TIER_VN[g.tier], bay_khan_hiem: !!g.scarcity, vong_xoay_no: g.ratRace, benh: L.ill ? L.ill.name : null,
    phong_cach: L.traits || {}, nhat_ky_gan_day: L.log.slice(-8).map(e => `${e.age}t: ${e.text}`), soi_day_con_treo: threads, npc: npcs,
    khai_niem_da_hoc: Object.keys(L.codex || {}).map(k => CONCEPTS[k][0])
  };
}

const NAR_RULES = `Bạn là biên kịch của một trò chơi mô phỏng cuộc đời dựa trên số liệu thực và lý thuyết trò chơi. Hãy viết MỘT tình huống mới cho nhân vật dưới đây, bằng tiếng Việt, giọng điềm tĩnh, cụ thể, không giáo điều, đúng với nước và hoàn cảnh (nghề, tiền, gia đình, các sợi dây còn treo). Ưu tiên: (1) nối tiếp một sợi dây còn treo nếu đến hạn hoặc hợp lý, (2) đưa một NPC đã có quay lại với vai mới, dựa trên niềm tin họ dành cho nhân vật, (3) nếu không thì tạo tình huống mới có cấu trúc lý thuyết trò chơi (song đề tù nhân, tối hậu thư, săn hươu, của cải chung, lòng tin, tín hiệu, chiến tranh tiêu hao, BATNA, gà, hàng hóa công, người tình nguyện, lời nguyền người thắng). Không lặp lại tình huống trong nhật ký. Lựa chọn phải có đánh đổi thật: cái lợi trước mắt và cái giá về sau.

Trả lời CHỈ bằng một object JSON đúng dạng sau, không có chữ nào khác:
{"title":"≤60 ký tự","text":"2–4 câu kể tình huống","concept":"một trong: pd,ultimatum,stag,commons,trust,signal,attrition,batna,chicken,public,volunteer,winner,hawkdove,bos,ev,nash hoặc null",
 "npc":{"id":"id của NPC đã có"} hoặc {"new":{"ten":"tên theo văn hóa nước đó","vai":"vai trò"}} hoặc null,
 "matrix": null hoặc {"me":["nước đi A","nước đi B"],"them":["nước đi A","nước đi B"],"cells":[[[a,b],[c,d]],[[e,f],[g,h]]],"unit":"$ PPP"} (mỗi ô: [bạn, họ]; chỉ dùng khi có đối thủ thật),
 "choices":[ 2 đến 4 lựa chọn, mỗi cái {"label":"≤40 ký tự","hint":"≤70 ký tự, nói rõ đánh đổi","tier":null|"awakened"|"sovereign","longterm":true|false,"fx":{...}} ],
 "def": chỉ số lựa chọn mặc định (0-based)}
fx là object chỉ gồm các khóa sau (bỏ qua khóa không dùng): health, happy, know, rel (−15..15); bw (−20..20, băng thông nhận thức); money (−1.2..1.2, tính theo TỶ LỆ thu nhập một năm, ví dụ −0.3 là mất 30% thu nhập năm); income_mult (0.7..1.4, nhân vào thu nhập về sau); trust {"npc":id,"delta":−0.6..0.6}; coop, fair, risk, bold (−3..3, tính cách); log "một câu kể kết quả"; flags ["cờ ngắn để nhớ về sau"]; later {"years":n,"note":"điều sẽ quay lại sau n năm"}; gamble {"p":xác suất thắng,"win":{fx},"lose":{fx}} cho lựa chọn may rủi; game {"npc":id,"move":"cooperate"|"defect"|"arbitrage","stake_frac":0.05..1} để engine tự phân xử một ván với NPC đó (KHÔNG tự gán kết quả khi dùng game; chỉ dùng npc.id có thật hoặc NPC mới ở trường npc).
Quy tắc: tier "sovereign" dành cho lựa chọn thứ ba thoát khỏi khung thắng-thua (viết luật mới, ký quỹ, liên minh, bỏ đi với phương án thay thế); tier "awakened" cho lựa chọn cần nhìn xa hơn tháng tới; longterm true cho lựa chọn chịu thiệt trước lợi sau. Ít nhất một lựa chọn có fx.later hoặc fx.flags để câu chuyện quay lại sau này. Nếu nhân vật dưới 12 tuổi: không dùng game, trust, matrix, money; viết chuyện tuổi thơ (gia đình, trường, bạn bè) với fx về chỉ số và flags.`;

function sceneFromAi(L, raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.choices) || raw.choices.length < 2) return null;
  const npcMap = {}; if (L.ar) for (const n of L.ar.state.npcs.values()) npcMap[n.id] = n;
  let npc = null;
  if (raw.npc && raw.npc.id && npcMap[raw.npc.id]) npc = npcMap[raw.npc.id];
  else if (raw.npc && raw.npc.new && L.ar) { npc = argonNpc(L, String(raw.npc.new.ten || anyName(L)).slice(0, 30), String(raw.npc.new.vai || "nguoi").replace(/\s+/g, "_").slice(0, 16)); npcMap[npc.id] = npc; }
  const choices = raw.choices.slice(0, 4).map(c => {
    const fx = clampFx(c.fx); if (fx.game) fx.game.npc = npc ? npc.id : fx.game.npc; if (fx.trust && npc && !npcMap[fx.trust.npc]) fx.trust.npc = npc.id;
    const ch = { label: String(c.label || "…").slice(0, 48), hint: String(c.hint || "").slice(0, 80), fx: L2 => applyFx(L2, fx, npcMap) };
    if (c.tier === "awakened" || c.tier === "sovereign") ch.tier = c.tier; if (c.longterm) ch.longterm = true; return ch;
  });
  if (!choices.every(c => c.label)) return null;
  let matrix = null;
  if (raw.matrix && Array.isArray(raw.matrix.cells) && raw.matrix.cells.length === 2 && npc) {
    const ok = raw.matrix.cells.every(r => Array.isArray(r) && r.length === 2 && r.every(x => Array.isArray(x) && x.length === 2 && x.every(v => typeof v === "number")));
    if (ok) matrix = { who: npc.name, me: (raw.matrix.me || ["A", "B"]).slice(0, 2).map(String), them: (raw.matrix.them || ["A", "B"]).slice(0, 2).map(String), cells: raw.matrix.cells, unit: String(raw.matrix.unit || "$ PPP") };
  }
  const concept = raw.concept && CONCEPTS[raw.concept] ? raw.concept : null;
  const def = clamp(Math.round(+raw.def || 0), 0, choices.length - 1);
  return { id: "ai", ai: true, key: "ai" + L.age, title: String(raw.title || "Một chuyện xảy ra").slice(0, 70), text: String(raw.text || "").slice(0, 600), choices, def, matrix, npc, fog: !!matrix, concept, tempt: npc && matrix ? { stake: Math.max(300, householdIncome(L)) * 0.3, roundsLeft: 2 } : null };
}

/* ---- Đạo diễn: quyết định khi nào xin tình huống mới, sinh trước một năm ---- */
function narratorPlan(L) {
  if (!NAR.enabled || NAR.status !== "ready" || !L.alive) return;
  if (L.age < 6) return;
  if (L.nextAi == null) L.nextAi = L.age + 1 + Math.floor(Math.random() * 2);
  const due = (L.threads || []).find(t => t.due && t.due <= L.age + 1);
  if (due && L.nextAi > L.age + 1) L.nextAi = L.age + 1;
  if (L.age === L.nextAi - 1 && !L.aiPending && !L.aiReady) narratorFetch(L);
}
async function narratorFetch(L) {
  L.aiPending = true; NAR.status = "busy"; if (typeof render === "function") render();
  const packet = JSON.stringify(statePacket(L));
  try {
    NAR.calls++;
    const raw = await NAR.sample.json(NAR_RULES + "\n\nNHÂN VẬT:\n" + packet, { modelTier: NAR.mode === "deep" ? "default" : "quick", cache: false });
    const sc = sceneFromAi(L, raw);
    if (sc) L.aiReady = sc; else NAR.lastErr = "Tình huống AI không hợp lệ, dùng kịch bản sẵn.";
    NAR.status = "ready";
  } catch (e) {
    NAR.lastErr = e && e.code ? e.code : "lỗi";
    NAR.status = (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared")) ? "off" : "ready";
    if (e && e.code === "rate_limited") NAR.cooldownMin = 5;
  }
  L.aiPending = false; if (typeof render === "function") render();
}
/* Gọi từ lifeEvents: nếu có tình huống AI đã sẵn sàng và đến hạn thì trình diễn */
function narratorPresent(L) {
  if (!L.aiReady || L.pending || L.age < (L.nextAi || 0)) return false;
  const sc = L.aiReady; L.aiReady = null;
  if (sc.concept) learn(L, sc.concept);
  L.threads = (L.threads || []).filter(t => !(t.due && t.due <= L.age));
  L.nextAi = L.age + NAR.cooldownMin + Math.floor(Math.random() * (NAR.cooldownMax - NAR.cooldownMin + 1));
  scene(L, sc); return true;
}
/* Nếu đến hạn mà AI chưa viết xong thì đồng hồ chờ (giao diện hiện "đang viết") */
function narratorWaiting(L) { return NAR.enabled && NAR.status !== "off" && L.aiPending && L.age >= (L.nextAi || 0) - 1 && !L.pending; }

/* ---- Lời cuối đời ---- */
async function narratorEpilogue(L, el) {
  if (!NAR.enabled || !NAR.sample || NAR.status === "off") return;
  el.textContent = "Đang viết lời cuối…";
  const T = L.ar ? Argon.lifeTopology(L.ar.state, L.ar.npcStart) : null;
  const ps = playStyle(L);
  const p = `Viết lời cuối đời (3 đoạn ngắn, tiếng Việt, ngôi thứ hai "bạn", giọng điềm tĩnh, không khuyên răn, không liệt kê số) cho nhân vật trong trò chơi mô phỏng cuộc đời này. Đoạn 1: cuộc đời đã sống. Đoạn 2: những ván bạn đã chơi với người khác và điều họ nhớ về bạn. Đoạn 3: nếu bạn được sinh ra lần nữa.\n\nDỮ LIỆU: ${JSON.stringify({ ten: L.name, nuoc: L.birthC.n, song_o: L.c.n, tuoi: L.age, mat_vi: L.cause, phong_cach: ps.name, nhat_ky: L.log.filter(e => e.tone && e.tone.includes("big")).slice(-14).map(e => e.age + "t: " + e.text), dia_hinh: T ? { nhom: T.quadrant, thang_du: Math.round(T.surplus.net_systemic_surplus), tu_chu: T.sovereignty, gon_song: { quay_lung: T.ripple.npcs_shifted_hostile, hop_tac: T.ripple.npcs_shifted_cooperative, pha_san: T.ripple.npcs_bankrupt, phat_dat: T.ripple.npcs_prospered, danh_tieng: Math.round(T.ripple.reputation_final) } } : null })}`;
  try { const { text } = await NAR.sample(p, { modelTier: NAR.mode === "deep" ? "default" : "quick", onText: ({ text }) => { el.textContent = text; } }); el.textContent = text; }
  catch (e) { el.textContent = e && e.text ? e.text : ""; }
}

</script>

<script>
/* ================= GIAO DIỆN ================= */

const store={get(){try{return JSON.parse(localStorage.getItem("mlcd.lives")||"[]")}catch(e){return[]}},
  add(x){try{const a=store.get();a.unshift(x);localStorage.setItem("mlcd.lives",JSON.stringify(a.slice(0,10)))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let G={life:null,peers:[],speed:1,paused:false,timer:null,acc:0,last:0,autoDecide:false,yearMs:2600};

   <div class="counter"><div><b id="cb">0</b><span class="label">em bé chào đời từ lúc bạn mở trang</span></div><div><b id="cd">0</b><span class="label">người qua đời</span></div></div>
  </div>

   <div class="field"><span class="label">Một năm trôi qua trong</span><div class="seg" id="len">
     <button class="btn" data-ms="1300">~1 giây</button><button class="btn on" data-ms="2600">~2,5 giây</button><button class="btn" data-ms="5000">~5 giây</button></div>
     <span class="muted" style="font-size:13px">Lúc chơi vẫn tăng tốc hoặc tạm dừng được. Từ 6 tuổi, một người kể chuyện AI sẽ viết thêm tình huống riêng cho cuộc đời này (trang sẽ xin phép dùng Claude lần đầu).</span></div>
   <button class="btn primary" id="born">Chào đời</button>
   ${(()=>{const m=META.get();return m.lives?`<span class="muted" style="font-size:13px">Kiếp thứ ${m.lives+1}. Ký ức tiền kiếp: ${m.perks.map(id=>(PERKS.find(x=>x.id===id)||{vi:id}).vi).join(", ")}.</span>`:""})()}
   ${past.length?`<div class="field"><span class="label">Các kiếp trước</span><div class="past">${past.map(p=>`<div class="row"><span>${esc(p.name)} · ${esc(p.country)}</span><span class="mono">${p.age} tuổi</span></div>`).join("")}</div></div>`:""}
  </div></section>
  <p class="foot">Số liệu gần đúng (khoảng năm 2023) cho ${COUNTRIES.length} quốc gia chiếm phần lớn số ca sinh trên thế giới: số ca sinh, tuổi thọ theo giới tính, tử vong dưới 5 tuổi, GDP bình quân (PPP), hệ số Gini, số năm đi học, tỷ lệ học đại học, tỷ suất sinh và mức hài lòng với cuộc sống. Tham chiếu UN World Population Prospects 2024, UN IGME, World Bank, UNDP và World Happiness Report qua Our World in Data. Thu nhập quy đổi theo giá cả ở Việt Nam để dễ hình dung. Cái chết và bệnh tật xảy ra theo tỷ lệ thống kê, không mô tả chi tiết.</p>`;
  const cb=document.getElementById("cb"),cd=document.getElementById("cd");
  const tick=()=>{if(!document.body.contains(cb))return;const s=(performance.now()-t0)/1000;cb.textContent=Math.floor(s*BIRTHS_PER_SEC).toLocaleString("vi-VN");cd.textContent=Math.floor(s*DEATHS_PER_SEC).toLocaleString("vi-VN");requestAnimationFrame(tick)};tick();
  document.querySelectorAll("#len .btn").forEach(b=>b.onclick=()=>{document.querySelectorAll("#len .btn").forEach(x=>x.classList.remove("on"));b.classList.add("on");G.yearMs=+b.dataset.ms});
  document.getElementById("born").onclick=birth;
}

function birth(){const seed=(Math.random()*2**32)>>>0;const L=createLife(seed);G.life=L;
  G.peers=[1,2,3].concat([4]).map(k=>simulatePeer((seed+k*7919)>>>0));
  const now=new Date();const nth=1+Math.floor(Math.random()*4);
  app.innerHTML=`<section class="cert">
   <div class="stamp">ĐÃ ĐĂNG KÝ<br>${now.getFullYear()}<br>#${String(seed%1e6).padStart(6,"0")}</div>
   <div class="label" style="text-align:center">Giấy khai sinh</div>
   <h2>${esc(L.name)}</h2>
   <div class="sub muted">em bé thứ ${nth} chào đời trong giây ${now.toLocaleTimeString("vi-VN")}</div>
   <dl>
    <dt>Nơi sinh</dt><dd>${esc(L.c.n)}</dd>
    <dt>Giới tính</dt><dd>${L.sex==="M"?"Nam":"Nữ"}</dd>
    <dt>Gia đình</dt><dd>${famWord(L.fam)} so với cả nước (khoảng ${fmtPPP(L.famIncome)}/người/năm, ≈ ${fmtVND(L.famIncome)}/tháng)</dd>
    <dt>Tuổi thọ trung bình</dt><dd class="mono">${L.le} tuổi</dd>
    <dt>Tử vong dưới 5 tuổi</dt><dd class="mono">${L.c.u5} trên 1.000 trẻ</dd>
    <dt>Số năm đi học TB</dt><dd class="mono">${L.c.s} năm</dd>
   </dl>
   <div class="actions"><button class="btn primary" id="go">Bắt đầu cuộc đời này</button><button class="btn" id="back">Về trang đầu</button></div>
  </section>`;
  document.getElementById("go").onclick=play;document.getElementById("back").onclick=intro}

function play(){const L=G.life;G.paused=false;
  app.innerHTML=`<header class="topbar">
    <div class="age" id="age">0<small>tuổi</small></div>
    <div class="who"><b>${esc(L.name)}</b><span class="muted" id="where"></span><span class="epi" id="epi"></span></div>
    <div class="spacer"></div>
    <div class="seg" id="speed">${[1,2,4,8,16].map(s=>`<button class="btn${s===1?" on":""}" data-s="${s}">${s}×</button>`).join("")}</div>
    <button class="btn" id="pause">Tạm dừng</button>
    <button class="btn" id="auto">Tự quyết: tắt</button>
    <button class="btn" id="aiBtn">AI kể chuyện</button>
    <button class="btn" id="codexBtn">Sổ tay</button>
    <button class="btn" id="quit">Thoát</button>
  </header>
  <div class="board">
   <aside class="panel" id="left"></aside>
   <main class="panel" style="gap:12px"><div id="codex" hidden></div><div id="dec"></div><div class="label">Nhật ký cuộc đời · mới nhất trước</div><div class="log" id="log"></div></main>
   <aside class="panel">
     <div class="field"><span class="label">Những người quanh bạn</span><div class="castlist" id="cast"></div></div>
     <div class="field"><span class="label">Bốn em bé sinh cùng giây · ở tuổi bạn</span><div id="peers"></div></div>
     <div class="field"><span class="label">Bản đồ cuộc đời · 1 ô = 1 năm</span><div class="map" id="map"></div>
       <div class="legend"><span>buồn</span><span>viền vàng: tuổi thọ TB</span><span>vui</span></div></div>
   </aside></div>`;
  document.querySelectorAll("#speed .btn").forEach(b=>b.onclick=()=>{G.speed=+b.dataset.s;document.querySelectorAll("#speed .btn").forEach(x=>x.classList.toggle("on",x===b))});
  document.getElementById("pause").onclick=()=>{G.paused=!G.paused;render()};

  document.getElementById("codexBtn").onclick=()=>{const c=document.getElementById("codex");c.hidden=!c.hidden;renderCodex()};
  document.getElementById("quit").onclick=()=>{if(G.life.alive){G.paused=true;render();askQuit()}else intro()};

function askQuit(){const d=document.getElementById("dec");d.innerHTML=`<div class="decision"><h3>Rời khỏi cuộc đời này?</h3><p style="margin:0">Cuộc đời đang sống sẽ không được lưu.</p>
  <div class="choices"><button class="btn" id="qy">Thoát về trang đầu</button><button class="btn" id="qn">Sống tiếp</button></div></div>`;
  document.getElementById("qy").onclick=intro;document.getElementById("qn").onclick=()=>{G.paused=false;render()}}

function start(){stop();G.last=performance.now();G.acc=0;const loop=t=>{G.timer=requestAnimationFrame(loop);const dt=t-G.last;G.last=t;const L=G.life;
  if(!L||G.paused||L.pending||!L.alive)return;if(narratorWaiting(L)){if(!G.waitShown){G.waitShown=true;render()}return}G.waitShown=false;G.acc+=dt*G.speed;if(G.acc>=G.yearMs){G.acc=0;stepYear(L);narratorPlan(L);render();if(!L.alive)setTimeout(ending,1400)}};G.timer=requestAnimationFrame(loop)}
function stop(){if(G.timer)cancelAnimationFrame(G.timer);G.timer=null}

function render(){const L=G.life;if(!L||!document.getElementById("age"))return;
  document.getElementById("age").innerHTML=`${L.age}<small>tuổi</small>`;
  document.getElementById("epi").textContent=epithets(L).join(" · ");
  document.getElementById("where").textContent=`${L.c.n}${L.migrated?` (sinh ở ${L.birthC.n})`:""} · ${stateLine(L)}`;
  document.getElementById("pause").textContent=G.paused?"Tiếp tục":"Tạm dừng";
  document.getElementById("codexBtn").textContent=`Sổ tay (${Object.keys(L.codex||{}).length})`;
  const ab=document.getElementById("aiBtn");ab.textContent=NAR.status==="off"?"AI kể chuyện: không có":`AI kể chuyện: ${NAR.enabled?(NAR.status==="busy"?"đang viết…":"bật"):"tắt"}`;ab.classList.toggle("on",NAR.enabled&&NAR.status!=="off");ab.disabled=NAR.status==="off";renderCodex();
  document.getElementById("auto").textContent=`Tự quyết: ${G.autoDecide?"bật":"tắt"}`;document.getElementById("auto").classList.toggle("on",G.autoDecide);
  const st=[["Sức khỏe","health"],["Hạnh phúc","happy"],["Kiến thức","know"],["Quan hệ","rel"]];
  const foci=availableFoci(L);
  document.getElementById("left").innerHTML=`<span class="label">Trạng thái · 0–100</span>
   ${st.map(([n,k])=>{const prev=G.prevSt?G.prevSt[k]:L.st[k];const d=Math.round(L.st[k]-prev);return`<div class="stat"><span>${n}</span><div class="bar"><i style="width:${L.st[k]}%"></i></div><span class="mono">${Math.round(L.st[k])}</span>${Math.abs(d)>=2?`<span class="delta ${d>0?"up":"dn"}">${d>0?"+":""}${d}</span>`:""}</div>`}).join("")}
   <div class="money"><span class="label">Thu nhập của bạn</span>
     <span class="big">${L.income>0?fmtPPP(L.income)+"/năm":"chưa có"}</span>
     ${L.income>0?`<span class="muted">≈ ${fmtVND(L.income)}/tháng theo giá Việt Nam</span>`:`<span class="muted">Gia đình: ${fmtPPP(L.famIncome)}/người/năm</span>`}
     <span class="label" style="margin-top:8px">Tiết kiệm${L.debt>0?" − nợ":""}</span><span class="big" style="color:${L.savings<0?"var(--bad)":"inherit"}">${L.savings<0?"−":""}${fmtPPP(Math.abs(L.savings))}</span>${L.debt>0?`<span class="muted">đang nợ ${fmtPPP(L.debt)}</span>`:""}</div>
   ${argonPanel(L)}
   <div class="field" style="border-top:1px solid var(--line);padding-top:12px"><span class="label">Trọng tâm năm nay</span>
    <div class="seg" id="foci">${foci.map(f=>`<button class="btn${L.focus===f?" on":""}" data-f="${f}" ${G.autoDecide?"disabled":""}>${FOCI[f].label}</button>`).join("")}</div>
    ${FOCI[L.focus]&&FOCI[L.focus].hint?`<span class="muted" style="font-size:12px">${FOCI[L.focus].hint}</span>`:""}</div>`;
  G.prevSt={...L.st};
  document.querySelectorAll("#foci .btn").forEach(b=>b.onclick=()=>{L.focus=b.dataset.f;render()});
  const fr=document.getElementById("frugal");if(fr)fr.onclick=()=>{L.ar.frugal=!L.ar.frugal;render()};
  // quyết định
  const dec=document.getElementById("dec");
  if(L.pending){const p=L.pending;const g=argonGate(L);const key=p.key||p.id+L.age;
    const states=p.choices.map(c=>choiceState(L,c,g));const anyHidden=states.includes("hidden"),anyLocked=states.includes("locked");
    const m=p.matrix?(p.fog?fogMatrix(L,p.matrix,key):p.matrix):null;
    const ddCost=35;const canDD=L.ar&&p.fog&&!L.ar.dd[key]&&g.tier!=="autopilot";
    dec.innerHTML=`<div class="decision${p.micro?" micro":""}"><span class="label">${p.micro?"Chuyện nhỏ":"Một quyết định đang chờ"} · tuổi ${L.age}${p.ai?" · do AI viết":""} · phím 1–${p.choices.length}</span><h3>${esc(p.title)}</h3><p style="margin:0">${esc(p.text)}</p>${m?matrixHtml(m):""}
     ${p.npc&&L.ar&&L.ar.dd[key]?`<div class="signal">${esc(npcSignalVN(L,p.npc,key))}</div>`:""}
     ${canDD?`<div><button class="btn" id="dd" ${g.bw<ddCost?"disabled":""}>Thẩm định (−${ddCost} băng thông)</button> <span class="muted" style="font-size:12px">${g.bw<ddCost?"Không đủ băng thông để thẩm định.":"Làm rõ các con số và đọc tín hiệu của đối phương."}</span></div>`:""}
     ${p.tempt&&p.npc&&L.ar&&g.tier!=="autopilot"?temptationVN(L,p.npc,p.tempt.stake,p.tempt.roundsLeft):""}
     ${p.causes&&p.causes.length?`<div class="cause">${esc(causeLine(L,p.causes))}</div>`:""}
     ${anyLocked?`<div class="gate">${esc(g.reason)}</div>`:""}
     ${anyHidden?`<div class="gate soft">Có một lựa chọn ở đây mà bạn chưa nhìn thấy. Người nhìn thấy nó là người đã bước ra khỏi kịch bản sẵn có.</div>`:""}
     ${g.bw<50&&L.ar?`<div class="timer" title="Băng thông thấp: bạn không có nhiều thời gian để nghĩ"><i id="timerbar" style="width:100%"></i></div>`:""}
     <div class="choices">${p.choices.map((c,i)=>{const st=states[i];if(st==="hidden")return`<button class="btn hiddenc" disabled><b>?</b><small>chưa nhìn thấy</small></button>`;
       const doors=choiceDoors(c);return`<button class="btn${st==="locked"?" locked":""}" data-i="${i}" ${st==="locked"?"disabled":""}><b>${esc(c.label)}</b><small>${st==="locked"?"không với tới được lúc này":esc(c.hint||"")}</small>${doors.map(d=>`<span class="doorbadge">đóng cửa: ${esc(CH.DOOR_VN(d).vi)}</span>`).join("")}</button>`}).join("")}</div></div>`;
    dec.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{clearInterval(G.timerIv);G.timerKey=null;resolve(L,+b.dataset.i);render()});
    if(g.bw<50&&L.ar&&G.timerKey!==key){clearInterval(G.timerIv);G.timerKey=key;const total=(6+24*(g.bw/100))*1000;const t0=performance.now();
      G.timerIv=setInterval(()=>{const bar=document.getElementById("timerbar");if(!bar||!L.pending||L.pending.key!==key){clearInterval(G.timerIv);return}const left=Math.max(0,1-(performance.now()-t0)/total);bar.style.width=(left*100)+"%";
        if(left<=0){clearInterval(G.timerIv);G.timerKey=null;const ok=p.choices.map((c,i)=>choiceState(L,c,g)==="show"?i:-1).filter(i=>i>=0);const pickI=ok.includes(p.def)?p.def:(ok[0]??0);log(L,"Bạn không kịp nghĩ. Bạn làm điều dễ nhất.","bad");resolve(L,pickI);render()}},250)}
    const ddb=document.getElementById("dd");if(ddb)ddb.onclick=()=>{if(dueDiligence(L,key,ddCost))render()}}
  else if(narratorWaiting(L))dec.innerHTML=`<div class="decision"><span class="label">Người kể chuyện đang viết một tình huống cho tuổi ${L.nextAi}…</span><p style="margin:0" class="muted">Lần đầu, trình duyệt sẽ hỏi bạn có cho phép trang này dùng Claude không. Có thể tắt AI kể chuyện trên thanh trên để chơi với kịch bản sẵn.</p></div>`;
  else if(!document.querySelector("#dec #qy"))dec.innerHTML="";
  // nhật ký
  document.getElementById("log").innerHTML=L.log.slice(-160).reverse().map(e=>`<div class="e ${e.tone}"><span class="a">${e.age}t</span><span class="t">${esc(e.text)}</span></div>`).join("");
  if(!L.alive)document.body.classList.remove("tunnel");
  // dàn nhân vật
  if(L.lw){const s=L.ar.state;const rows=[...L.lw.cast.values()].filter(m=>!m.absent&&(m.alive||m.role==="mother"||m.role==="father"||m.role==="spouse")).sort((a,b)=>(b.alive-a.alive)||Math.abs(Argon.opinionOf(s,L.lw.mem,b.id))-Math.abs(Argon.opinionOf(s,L.lw.mem,a.id))).slice(0,10);
    document.getElementById("cast").innerHTML=rows.map(m=>{const op=Argon.opinionOf(s,L.lw.mem,m.id);const col=op>=.5?"var(--good)":op<=-.35?"var(--bad)":op<=-.1?"var(--seal)":"var(--line)";const mem=m.alive?memoryLine(L,m.id):"";
      const pr=(L.lw.promises||[]).find(p=>p.to===m.id&&p.kept===null);
      return`<div class="p${m.alive?"":" dead"}" title="${esc(mem)}"><i style="background:${col}"></i><span><b>${esc(m.name)}</b> <span class="r">${esc(m.roles.map(r=>LW.ROLE_VN[r]).join(", "))}${m.alive?` · gọi bạn là “${addressOf(L,m.id)}”`:" · đã mất"}</span>${mem?`<br><span class="r">${esc(mem)}</span>`:""}${pr?`<br><span class="r" style="color:var(--seal)">bạn hứa: ${esc(pr.what)} (trước ${pr.due} tuổi)</span>`:""}</span><span class="mono r">${m.alive?(L.age+m.age_offset)+"t":""}</span></div>`}).join("")}
  // đường hầm khan hiếm
  {const g=argonGate(L);document.body.classList.toggle("tunnel",!!(g.bw<30||(g.scarcity&&g.scarcity.bandwidth_tax>=15)));}
  // người cùng giây
  document.getElementById("peers").innerHTML=G.peers.map(p=>{const dead=p.deathAge<L.age||(p.deathAge===L.age&&p.tl[L.age]==null);
    const line=dead?`đã mất ở tuổi ${p.deathAge} (${p.cause})`:(p.tl[L.age]||p.tl[p.tl.length-1]);
    return`<div class="peer${dead?" dead":""}"><span class="n">${esc(p.name)}</span><span class="muted">${p.sex==="M"?"Nam":"Nữ"} · ${esc(p.c.n)}</span><span>${esc(line)}</span></div>`}).join("");
  // bản đồ
  const n=Math.max(L.le+10,L.map.length+1,60);const cells=[];
  for(let i=0;i<Math.ceil(n/10)*10;i++){const m=L.map[i-1];let cls="",style="";
    if(i===0)style="background:var(--seal)";else if(m&&m.end)cls="end";else if(m)style=`background:color-mix(in oklab,var(--low),var(--high) ${Math.round(m.h)}%)`;
    if(i===L.age&&L.alive)cls+=" now";if(i===L.le)cls+=" le";cells.push(`<i class="${cls}" style="${style}" title="${i} tuổi"></i>`)}
  document.getElementById("map").innerHTML=cells.join("")}

function argonPanel(L){if(!L.ar)return"";const g=argonGate(L);
  const badges=[`<span class="badge ${g.tier==="sovereign"?"seal":g.tier==="awakened"?"acc":""}">${AR.TIER_VN[g.tier]}</span>`];
  if(g.scarcity)badges.push(`<span class="badge bad">Bẫy khan hiếm</span>`);if(g.ratRace)badges.push(`<span class="badge bad">Vòng xoáy chuột chạy</span>`);
  return`<div class="field" style="border-top:1px solid var(--line);padding-top:12px"><span class="label">Băng thông nhận thức</span>
   <div class="stat"><span>Băng thông</span><div class="bar"><i style="width:${g.bw}%;background:${g.bw<30?"var(--bad)":"var(--accent)"}"></i></div><span class="mono">${Math.round(g.bw)}</span></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap">${badges.join("")}</div>
   ${g.locked?`<span class="muted" style="font-size:12px">${esc(g.reason)}</span>`:g.scarcity?`<span class="muted" style="font-size:12px">Lo toan ${g.scarcity.reason==="stress"?"căng thẳng":"tiền bạc"} đang lấy mất ${Math.round(g.scarcity.bandwidth_tax)} điểm băng thông mỗi quý.</span>`:""}
   ${g.tier!=="autopilot"?`<button class="btn${L.ar.frugal?" on":""}" id="frugal" style="font-size:12px">Sống dưới mức thu nhập: ${L.ar.frugal?"bật":"tắt"}</button>`:""}</div>`}
function choiceDoors(c){const e=c._fx;if(!e)return[];const out=new Set(e.close_doors||[]);if(e.secret)out.add("clean_record");if(e.gamble){for(const d of [...(e.gamble.win.close_doors||[]),...(e.gamble.lose.close_doors||[])])out.add(d);if(e.gamble.win.secret||e.gamble.lose.secret)out.add("clean_record")}return[...out].filter(d=>!(G.life&&G.life.lw&&G.life.lw.cz.doors.has(d)))}
function matrixHtml(m){return `<div class="mx"><table><tr><th></th>${m.them.map(t=>`<th>${esc(m.who||"Họ")}: ${esc(t)}</th>`).join("")}</tr>${m.me.map((a,i)=>`<tr><th>Bạn: ${esc(a)}</th>${m.them.map((b,j)=>{const c=m.cells[i][j];const hide=m.hideOffDiag&&i!==j;return`<td class="${m.fogged?"fog":""}">${hide?"?":`<b>${m.fogged?"≈":""}${fmtCell(c[0],m.unit)}</b> / ${fmtCell(c[1],m.unit)}`}</td>`}).join("")}</tr>`).join("")}</table><span class="muted" style="font-size:12px">Mỗi ô: bạn / ${esc(m.who||"họ")} · ${esc(m.unit)}${m.fogged?" · con số là ước lượng, băng thông thấp thì càng mờ":""}</span></div>`}
function fmtCell(v,u){return u==="$ PPP"?(v<0?"−":"")+fmtPPP(Math.abs(v)):(v>0?"+":"")+v}
function codexHtml(L){const ids=Object.keys(L.codex||{});if(!ids.length)return`<span class="muted">Chưa có trang nào. Mỗi tình huống bạn gặp sẽ mở thêm một khái niệm của lý thuyết trò chơi.</span>`;
  return ids.map(id=>`<div class="c"><b>${esc(CONCEPTS[id][0])}</b><span class="muted">mở ở tuổi ${L.codex[id]}</span><span>${esc(CONCEPTS[id][1])}</span></div>`).join("")}
function renderCodex(){const L=G.life,c=document.getElementById("codex");if(!c||c.hidden)return;const n=Object.keys(L.codex||{}).length;
  c.innerHTML=`<div class="codex"><div style="display:flex;justify-content:space-between;align-items:center"><span class="label">Sổ tay lý thuyết trò chơi · ${n}/${Object.keys(CONCEPTS).length}</span><button class="btn" id="codexClose">Đóng</button></div>${codexHtml(L)}</div>`;
  document.getElementById("codexClose").onclick=()=>{c.hidden=true}}
function ending(){stop();document.body.classList.remove("tunnel");clearInterval(G.timerIv);const L=G.life;const meta=metaOnDeath(L);const kids=L.kids.filter(k=>k.alive).length;
  const avgH=Math.round(L.map.filter(m=>!m.end).reduce((s,m)=>s+m.h,0)/Math.max(1,L.map.filter(m=>!m.end).length));
  store.add({name:L.name,country:L.birthC.n,age:L.age,cause:L.cause,date:Date.now()});
  const diff=L.age-L.le;
  app.innerHTML=`<section class="end">
   <div class="label">Cuộc đời đã khép lại</div>
   <h2>${esc(L.name)}, ${L.age} tuổi</h2>
   <div class="panel" style="font-family:var(--f-display);font-size:17px;line-height:1.65;gap:12px"><span class="label" style="font-family:var(--f-body)">Văn bia</span>${eulogyVN(L).map(p=>`<p style="margin:0">${esc(p)}</p>`).join("")}<div id="epilogue" style="white-space:pre-line;border-top:1px dashed var(--line);padding-top:12px" hidden></div></div>
   <p style="font-size:18px;margin:0">Sinh ra ở ${esc(L.birthC.n)}${L.migrated?`, mất ở ${esc(L.c.n)}`:""}. Qua đời vì ${esc(L.cause)}. ${diff>=0?`Sống lâu hơn tuổi thọ trung bình nơi sinh ${diff} năm.`:`Ít hơn tuổi thọ trung bình nơi sinh ${-diff} năm.`}</p>
   <div class="facts">
    <div><span class="label">Đi học</span><b>${L.school.years} năm</b><span class="muted">${L.school.deg?"có bằng đại học":L.school.never?"chưa từng đến trường":"không học đại học"}</span></div>
    <div><span class="label">Nghề</span><b style="font-size:16px;font-family:var(--f-body)">${esc(L.job||"không có")}</b></div>
    <div><span class="label">Gia đình</span><b>${L.kids.length} con</b><span class="muted">${kids} còn sống${L.spouse?` · bạn đời ${esc(L.spouse)}`:""}</span></div>
    <div><span class="label">Hạnh phúc TB</span><b>${avgH}/100</b></div>
   </div>
   ${(()=>{const ps=playStyle(L);return`<div class="panel style"><span class="label">Phong cách chơi của bạn</span><h3 style="font-size:24px">${esc(ps.name)}</h3><p style="margin:0">${esc(ps.desc)}</p>
     <span class="muted mono" style="font-size:12px">hợp tác ${ps.t.coop>=0?"+":""}${ps.t.coop} · công bằng ${ps.t.fair>=0?"+":""}${ps.t.fair} · liều ${ps.t.risk>=0?"+":""}${ps.t.risk} · cứng rắn ${ps.t.bold>=0?"+":""}${ps.t.bold} · thắng ${ps.g.w}/${ps.g.n} ván có đối thủ</span></div>`})()}
   ${(()=>{try{return counterfactualVN(L)}catch(e){console.error(e);return""}})()}
   ${causalityVN(L)}
   ${topologyVN(L)}
   <div class="panel"><span class="label">Sổ tay lý thuyết trò chơi · ${Object.keys(L.codex||{}).length}/${Object.keys(CONCEPTS).length} trang</span>${codexHtml(L)}</div>
   <div class="panel"><span class="label">Bốn em bé sinh cùng giây với bạn</span>
    ${G.peers.map(p=>`<div class="peer"><span class="n">${esc(p.name)} · ${esc(p.c.n)}</span><span>Sống đến ${p.deathAge} tuổi, ${esc(p.cause)}. ${esc(p.tl[Math.max(0,p.deathAge-1)]||"")}</span></div>`).join("")}</div>
   <div class="panel"><span class="label">Tiền kiếp</span><p style="margin:0">Đây là kiếp thứ ${meta.lives}. Ký ức mang sang kiếp sau: ${meta.perks.map(id=>{const p=PERKS.find(x=>x.id===id);return p?`<b>${p.vi}</b> (${p.desc})`:id}).join(" · ")||"chưa có"}.</p></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="again">Chào đời lần nữa</button><button class="btn" id="home">Về trang đầu</button></div>
   <p class="foot">Đây là mô phỏng dựa trên số liệu trung bình, không dự đoán cuộc đời của bất kỳ ai có thật.</p></section>`;
  document.getElementById("again").onclick=birth;document.getElementById("home").onclick=intro;
  const ep=document.getElementById("epilogue");if(NAR.enabled&&NAR.status!=="off"&&NAR.sample){ep.hidden=false;narratorEpilogue(L,ep)}}

narratorInit();
document.addEventListener("keydown",e=>{if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;const n=parseInt(e.key,10);if(!n)return;const b=document.querySelector(`#dec [data-i="${n-1}"]:not([disabled])`);if(b){e.preventDefault();b.click()}});
intro();
</script>
